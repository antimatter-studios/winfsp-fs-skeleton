[package]
name = "winfsp-fs-skeleton"
version = "0.2.1"
edition = "2021"
license = "GPL-3.0-or-later"
description = """
Reusable skeleton for Windows userspace filesystem drivers built on
WinFsp: SCM service that watches for disk arrivals and asks
WinFsp.Launcher to mount discovered partitions in the active console
session, plus partition-table parsing, raw-device I/O with
sector-aligned reads, drive-letter selection, and per-arch installer +
CI templates. Each consumer plugs in only its FS-specific bits via
the `FsBackend` trait.
"""
repository = "https://github.com/antimatter-studios/winfsp-fs-skeleton"
readme = "README.md"

[features]
default = []
# `service` is the SCM dispatcher variant of the watcher (mounts via
# WinFsp.Launcher in the active console session). Optional + Windows
# only -- on macOS the cfg-gated module is a stub. Pulled in by
# consumers that ship the auto-mount service.
service = ["dep:windows-service"]

[dependencies]
anyhow = "1"
ctrlc = "3"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    # Win32_Graphics_Gdi: gates WNDCLASSW + RegisterClassW even though
    # we don't actually do any GDI drawing -- those types are
    # nominally graphics-adjacent in windows-sys's feature split.
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

# Optional, gated on the `service` feature. The SCM dispatcher only
# makes sense on Windows; the cfg-gated module is a stub elsewhere.
windows-service = { version = "0.7", optional = true }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
# panic = "abort" is the right semantics for a binary that runs as a
# Windows Service: no human is around to read a panic message, and
# unwinding the SCM-controlled main thread would only delay the
# inevitable termination. Drops the unwinder for a slight code-size
# win too.
panic = "abort"
